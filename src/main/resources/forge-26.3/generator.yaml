name: Forge for @minecraft (@buildfileversion)
status: dev
buildfileversion: 66.1.5

import:
  - datapack-26.3.x

# Gradle task definitions for the generated Forge workspace.
gradle:
  run_client: runClient
  run_server: runServer
  export_file: "build/libs/modid-1.0.jar"

import_formatter:
  duplicates_whitelist:
    - java.util
    - net.minecraft
    - net.minecraftforge
  priority_imports:
    Nullable: org.jetbrains.annotations
    Mod: net.minecraftforge.fml.common
    SubscribeEvent: net.minecraftforge.eventbus.api.listener
    BusGroup: net.minecraftforge.eventbus.api.bus
    FMLJavaModLoadingContext: net.minecraftforge.fml.javafmlmod
    DeferredRegister: net.minecraftforge.registries
    RegistryObject: net.minecraftforge.registries
    ForgeRegistries: net.minecraftforge.registries
    Dist: net.minecraftforge.api.distmarker
    Codec: com.mojang.serialization
    SoundEvent: net.minecraft.sounds
    Blocks: net.minecraft.world.level.block
    Items: net.minecraft.world.item
    Multimap: com.google.common.collect
    ImmutableSet: com.google.common.collect
    Iterables: com.google.common.collect
    Attributes: net.minecraft.world.entity.ai.attributes
    Keyframe: net.minecraft.client.animation
    Potion: net.minecraft.world.item.alchemy
    MapColor: net.minecraft.world.level.material
    AttributeModifier: net.minecraft.world.entity.ai.attributes
    Consumer: java.util.function
    VertexFormat: com.mojang.renderpearl.api.vertex

# Base generator roots.
source_root: "@WORKSPACEROOT/src/main/java"
res_root: "@WORKSPACEROOT/src/main/resources"
mod_assets_root: "@RESROOT/assets/@modid"
mod_data_root: "@RESROOT/data/@modid"

# Resource folders shared with the NeoForge generator layout.
sounds_dir: "@MODASSETSROOT/sounds"
structures_dir: "@MODDATAROOT/structure"
block_textures_dir: "@MODASSETSROOT/textures/block"
item_textures_dir: "@MODASSETSROOT/textures/item"
entity_textures_dir: "@MODASSETSROOT/textures/entities"
effect_textures_dir: "@MODASSETSROOT/textures/mob_effect"
particle_textures_dir: "@MODASSETSROOT/textures/particle"
screen_textures_dir: "@MODASSETSROOT/textures/screens"
armor_textures_dir: "@MODASSETSROOT/textures/entity/equipment/humanoid"
other_textures_dir: "@MODASSETSROOT/textures"

# Vanilla resources for the texture picker.
vanilla_resources_jar: "client-extra-.*\\.jar"
vanilla_block_textures_dir: "assets/minecraft/textures/block"
vanilla_item_textures_dir: "assets/minecraft/textures/item"

base_templates:
  - template: modbase/mod.java.ftl
    name: "@SRCROOT/@BASEPACKAGEPATH/@JavaModName.java"
  - template: modbase/mods.toml.ftl
    usercodeComment: "#"
    writer: file
    name: "@RESROOT/META-INF/mods.toml"
  - template: pack.mcmeta.ftl
    writer: json
    name: "@RESROOT/pack.mcmeta"
  - template: elementinits/tabs.java.ftl
    name: "@SRCROOT/@BASEPACKAGEPATH/init/@JavaModNameTabs.java"
    condition: hasItemsInTabs()
  - template: modbase/clientfluidmodels.java.ftl
    name: "@SRCROOT/@BASEPACKAGEPATH/client/@JavaModNameFluidModels.java"
    condition: "${types.fluids?has_content}"
  - template: modbase/deferredsoundtype.java.ftl
    name: "@SRCROOT/@BASEPACKAGEPATH/util/DeferredSoundType.java"
  - template: modbase/signblockentities.java.ftl
    name: "@SRCROOT/@BASEPACKAGEPATH/init/@JavaModNameSignBlockEntities.java"
    condition: "${types.blocks?filter(e -> e.isSign())?size != 0}"
  - template: modbase/signrenderers.java.ftl
    name: "@SRCROOT/@BASEPACKAGEPATH/client/@JavaModNameSignRenderers.java"
    condition: "${types.blocks?filter(e -> e.isSign())?size != 0}"
  - template: elementinits/javamodels.java.ftl
    name: "@SRCROOT/@BASEPACKAGEPATH/init/@JavaModNameModels.java"
    condition: "${javamodels?has_content || types.specialentities?has_content}"
  - template: keybind_network.java.ftl
    name: "@SRCROOT/@BASEPACKAGEPATH/network/@JavaModNameNetwork.java"
    condition: "${keybinds?has_content}"

tags:
  template: tags.json.ftl
  name: "@RESROOT/data/@namespace/tags/@folder/@name.json"

language_file:
  format: json
  root_folder: "@MODASSETSROOT/lang/"
  langfile_name: "@langname.json"

resources_setup_tasks:
  - task: copy_models
    type: OBJ_referencetextures
    to: "@MODASSETSROOT/models/item"
  - task: copy_models
    type: JSON_noinlinetextures
    to: "@MODASSETSROOT/models/custom"
